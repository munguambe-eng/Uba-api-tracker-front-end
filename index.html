<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBA Data — Project Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0f0f;--ink2:#4a4a4a;--ink3:#8a8a8a;--ink4:#c0c0c0;
  --bg:#fafaf8;--surface:#ffffff;--surface2:#f4f3ef;
  --border:#e8e6e0;--border2:#d0cec8;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-text:#791F1F;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --gray-bg:#F1EFE8;--gray-text:#5F5E5A;
  --r:8px;--rl:12px;font-size:15px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400}
#app{display:none}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-wrap{width:380px}
.login-logo{font-family:'DM Serif Display',serif;font-size:28px;color:var(--ink);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--ink3);margin-bottom:2rem}
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.75rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px;letter-spacing:.02em}
.form-group input,.form-group select,.form-group textarea{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--ink)}
.btn-primary{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:10px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.error-msg{font-size:12px;color:var(--red);margin-top:.5rem;text-align:center;min-height:18px}
.success-msg{font-size:13px;color:var(--green-text);background:var(--green-bg);border-radius:var(--r);padding:12px;text-align:center;margin-top:.75rem;line-height:1.5}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:0.5px solid var(--border);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:4px}
.sidebar-logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);padding:.5rem .75rem;margin-bottom:.5rem}
.sidebar-logo span{display:block;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ink3);font-weight:400;margin-top:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);font-size:13px;color:var(--ink2);cursor:pointer;transition:background .1s;border:none;background:transparent;width:100%;text-align:left;font-family:'DM Sans',sans-serif}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--surface2);color:var(--ink);font-weight:500}
.nav-icon{width:16px;height:16px;flex-shrink:0}
.sidebar-bottom{margin-top:auto;padding-top:1rem;border-top:0.5px solid var(--border)}
.user-row{display:flex;align-items:center;gap:10px;padding:.5rem .25rem}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;color:var(--ink)}
.user-role{font-size:11px;color:var(--ink3)}
.logout-btn{font-size:12px;color:var(--ink3);background:transparent;border:none;cursor:pointer;padding:4px 0;font-family:'DM Sans',sans-serif}
.logout-btn:hover{color:var(--ink)}
.main{padding:2rem;overflow-y:auto}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem}
.page-title{font-size:24px;color:var(--ink)}
.page-sub{font-size:13px;color:var(--ink3);margin-top:4px}
.btn-add{background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:9px 16px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-add:hover{opacity:.85}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--surface2);border-radius:var(--r);padding:1rem;border:0.5px solid var(--border)}
.stat-label{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:26px;font-family:'DM Serif Display',serif;color:var(--ink)}
.projects-grid{display:flex;flex-direction:column;gap:10px}
.project-card{background:var(--surface);border-left:4px solid var(--border2);border-top:0.5px solid var(--border);border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);border-radius:var(--rl);padding:1.25rem;cursor:pointer;transition:all .15s}
.project-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.project-card.status-on-track{border-left-color:#1D9E75}
.project-card.status-at-risk{border-left-color:#BA7517}
.project-card.status-blocked{border-left-color:#A32D2D}
.project-card.status-completed{border-left-color:#185FA5}
.project-card.status-on-hold{border-left-color:#8a8a8a}
.project-card.status-overdue{border-left-color:#A32D2D;background:#fffbfb}
.project-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem}
.project-card-name{font-size:15px;font-weight:500;color:var(--ink)}
.project-card-owner{font-size:12px;color:var(--ink3);margin-top:2px}
.card-actions{display:flex;gap:6px;align-items:center}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
.badge-on-track{background:var(--green-bg);color:var(--green-text)}
.badge-at-risk{background:var(--amber-bg);color:var(--amber-text)}
.badge-blocked{background:var(--red-bg);color:var(--red-text)}
.badge-completed{background:var(--blue-bg);color:var(--blue-text)}
.badge-on-hold{background:var(--gray-bg);color:var(--gray-text)}
.badge-overdue{background:#FCEBEB;color:#791F1F;border:1px solid #f5c6c6}
.project-card-meta{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;font-size:12px;color:var(--ink3);margin-bottom:.75rem}
.meta-item strong{display:block;font-size:13px;color:var(--ink);font-weight:500;margin-bottom:1px}
.progress-bar-wrap{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.progress-fill.risk{background:var(--amber)}
.progress-fill.danger{background:var(--red)}
.progress-fill.done{background:var(--blue)}
.project-card-comment{font-size:13px;color:var(--ink2);border-top:0.5px solid var(--border);padding-top:.75rem;margin-top:.75rem;line-height:1.6}
.icon-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--r);padding:5px 8px;cursor:pointer;font-size:12px;color:var(--ink3);font-family:'DM Sans',sans-serif}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.members-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.member-chip{font-size:11px;background:var(--surface2);border:0.5px solid var(--border);border-radius:20px;padding:2px 8px;color:var(--ink2)}
.modal-overlay{display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;background:rgba(15,15,15,.45);min-height:100vh;position:fixed;top:0;left:0;width:100%;z-index:1000;overflow-y:auto}
.modal-overlay.open{display:flex !important}
.modal{background:var(--surface);border-radius:var(--rl);border:0.5px solid var(--border);width:100%;max-width:700px;padding:1.75rem;margin:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.modal-title{font-size:20px;color:var(--ink)}
.modal-close{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--ink3);line-height:1;padding:4px}
.modal-close:hover{color:var(--ink)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:.75rem}
.form-row.full{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);outline:none;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ink)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem;padding-top:1rem;border-top:0.5px solid var(--border)}
.btn-secondary{background:transparent;border:0.5px solid var(--border2);border-radius:var(--r);padding:8px 16px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--ink2)}
.btn-secondary:hover{background:var(--surface2)}
.btn-danger{background:var(--red-bg);border:0.5px solid var(--red-bg);border-radius:var(--r);padding:8px 16px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--red-text)}
.b-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.b-row input{flex:1}
.b-remove{background:transparent;border:none;cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;padding:2px 4px}
.b-remove:hover{color:var(--red)}
.btn-ghost{background:transparent;border:0.5px dashed var(--border2);border-radius:var(--r);padding:6px 12px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--ink3);width:100%}
.btn-ghost:hover{background:var(--surface2)}
.detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:1.5rem}
.back-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--r);padding:7px 12px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--ink2);white-space:nowrap}
.back-btn:hover{background:var(--surface2)}
.detail-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.5rem;margin-bottom:1rem}
.detail-section-title{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:.75rem}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem}
.detail-item label{font-size:11px;color:var(--ink3);display:block;margin-bottom:3px}
.detail-item span{font-size:14px;color:var(--ink);font-weight:500}
.update-item{border-left:2px solid var(--border);padding-left:1rem;margin-bottom:1rem}
.update-date{font-size:11px;color:var(--ink3);margin-bottom:4px}
.update-comment{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:6px}
.update-tags{display:flex;gap:6px;flex-wrap:wrap}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r)}
.task-item.overdue{border-left:3px solid var(--red)}
.task-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.task-check.done{background:var(--green);border-color:var(--green)}
.task-check.in-progress{background:var(--amber);border-color:var(--amber)}
.task-check.blocked{background:var(--red);border-color:var(--red)}
.task-content{flex:1;min-width:0}
.task-name{font-size:13px;font-weight:500;color:var(--ink)}
.task-meta{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap;align-items:center}
.task-due{font-size:11px;color:var(--ink3)}
.task-due.overdue{color:var(--red);font-weight:500}
.task-dep{font-size:11px;color:var(--amber-text);background:var(--amber-bg);padding:1px 6px;border-radius:4px}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.task-btn{background:transparent;border:0.5px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:11px;color:var(--ink3);font-family:'DM Sans',sans-serif}
.task-btn:hover{background:var(--surface2)}
.file-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:var(--r);border:0.5px solid var(--border)}
.file-icon{font-size:18px;flex-shrink:0}
.file-name{font-size:13px;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-link{font-size:12px;color:var(--blue);text-decoration:none}
.file-link:hover{text-decoration:underline}
.file-remove{background:transparent;border:none;cursor:pointer;color:var(--ink3);font-size:14px;padding:2px}
.file-remove:hover{color:var(--red)}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--r);padding:1rem;text-align:center;font-size:13px;color:var(--ink3);cursor:pointer;transition:background .15s;display:block}
.upload-zone:hover{background:var(--surface2)}
.member-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.member-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:var(--r);border:0.5px solid var(--border)}
.member-avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.member-info{flex:1}
.member-name{font-size:13px;font-weight:500;color:var(--ink)}
.member-email{font-size:11px;color:var(--ink3)}
.member-remove{background:transparent;border:none;cursor:pointer;color:var(--ink3);font-size:14px;padding:2px}
.member-remove:hover{color:var(--red)}
.report-controls{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.25rem;margin-bottom:1.5rem;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.btn-export{background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:9px 16px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer}
.btn-export:hover{opacity:.85}
.report-preview{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:2rem}
.loading-state{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;padding:2rem 0}
.loading-dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:pulse 1.2s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.empty-state{text-align:center;padding:3rem 0;color:var(--ink3);font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;font-family:'DM Sans',sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}
.report-doc{font-family:'DM Sans',sans-serif;color:#0f0f0f;max-width:720px;margin:0 auto}
.report-doc .r-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:1.5rem;margin-bottom:1.5rem;border-bottom:2px solid #0f0f0f}
.report-doc .r-org{font-family:'DM Serif Display',serif;font-size:22px}
.report-doc .r-title{font-size:13px;color:#4a4a4a;margin-top:2px}
.report-doc .r-meta{text-align:right;font-size:12px;color:#4a4a4a;line-height:1.8}
.report-doc h2{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:1rem;margin-top:1.5rem}
.report-doc .r-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.report-doc .r-stat{background:#f4f3ef;border-radius:8px;padding:.75rem 1rem}
.report-doc .r-stat-val{font-size:22px;font-family:'DM Serif Display',serif;color:#0f0f0f}
.report-doc .r-stat-lbl{font-size:11px;color:#8a8a8a;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.report-doc .r-project{border:0.5px solid #e8e6e0;border-radius:10px;padding:1.25rem;margin-bottom:.75rem}
.report-doc .r-proj-name{font-size:15px;font-weight:500;margin-bottom:.5rem}
.report-doc .r-proj-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:#4a4a4a;margin-bottom:.5rem}
.report-doc .r-proj-row span{display:block;font-size:13px;color:#0f0f0f;font-weight:500;margin-top:1px}
.report-doc .r-prog{height:4px;background:#e8e6e0;border-radius:2px;overflow:hidden;margin:.5rem 0}
.report-doc .r-prog-fill{height:100%;background:#1D9E75;border-radius:2px}
.report-doc .r-block{background:#FAEEDA;border-radius:6px;padding:.5rem .75rem;font-size:12px;color:#633806;margin-top:.5rem}
.report-doc .r-footer{margin-top:2rem;padding-top:1rem;border-top:0.5px solid #e8e6e0;font-size:11px;color:#8a8a8a;display:flex;justify-content:space-between}
@media print{.sidebar,.report-controls,.btn-export,.back-btn,.icon-btn,.btn-add,.card-actions,.modal-overlay,.page-header button{display:none!important}.layout{grid-template-columns:1fr}.report-preview{border:none;padding:0}body{background:#fff}.main{padding:.5rem}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">UBA Data</div>
    <div class="login-sub">Project Tracker — Data Science Division</div>
    <div class="login-card" id="login-card">
      <div style="display:flex;gap:0;margin-bottom:1.25rem;border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden">
        <button id="tab-signin" onclick="switchTab('signin')" style="flex:1;padding:8px;font-size:13px;font-family:'DM Sans',sans-serif;border:none;background:var(--ink);color:#fff;cursor:pointer">Sign in</button>
        <button id="tab-register" onclick="switchTab('register')" style="flex:1;padding:8px;font-size:13px;font-family:'DM Sans',sans-serif;border:none;background:transparent;color:var(--ink2);cursor:pointer">Register</button>
      </div>
      <div id="panel-signin">
        <div class="form-group"><label>Work email</label><input type="text" id="login-email" placeholder="you@ubagroup.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign in</button>
      </div>
      <div id="panel-register" style="display:none">
        <div class="form-group"><label>Full name</label><input type="text" id="reg-name" placeholder="e.g. Ana Silva" autocomplete="off"></div>
        <div class="form-group"><label>Work email</label><input type="text" id="reg-email" placeholder="you@ubagroup.com" autocomplete="off"></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="Min. 6 characters" autocomplete="new-password"></div>
        <button class="btn-primary" id="reg-btn" onclick="doRegister(event)">Create account</button>
      </div>
      <div class="error-msg" id="login-error"></div>
      <div id="login-success" style="display:none"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-logo">UBA Data<span>Project Tracker</span></div>
      <button class="nav-item active" id="nav-dashboard" onclick="showView('dashboard')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity=".7"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity=".7"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".7"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".3"/></svg>
        Dashboard
      </button>
      <button class="nav-item" id="nav-projects" onclick="showView('projects')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="2" rx="1" fill="currentColor" opacity=".7"/><rect x="1" y="7" width="14" height="2" rx="1" fill="currentColor" opacity=".7"/><rect x="1" y="11" width="9" height="2" rx="1" fill="currentColor" opacity=".4"/></svg>
        Projects

        <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.2" opacity=".7"/><rect x="5" y="5" width="6" height="1.2" rx=".6" fill="currentColor" opacity=".5"/><rect x="5" y="8" width="6" height="1.2" rx=".6" fill="currentColor" opacity=".5"/><rect x="5" y="11" width="4" height="1.2" rx=".6" fill="currentColor" opacity=".3"/></svg>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Add project</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://uba-tracker-api-production-ebef.up.railway.app';
const COUNTRIES=['Angola','Botswana','Cameroon','Congo','Côte d\'Ivoire','DRC','Ethiopia','Ghana','Guinea','Kenya','Liberia','Mozambique','Nigeria','Rwanda','Senegal','Sierra Leone','South Africa','Tanzania','Uganda','Zambia','Zimbabwe','Other'];
const STATUS_LABELS={'on-track':'On track','at-risk':'At risk','blocked':'Blocked','completed':'Completed','on-hold':'On hold','overdue':'Overdue'};
const STATUS_CLASS={'on-track':'badge-on-track','at-risk':'badge-at-risk','blocked':'badge-blocked','completed':'badge-completed','on-hold':'badge-on-hold','overdue':'badge-overdue'};
const FILL_CLASS={'on-track':'','at-risk':'risk','blocked':'danger','completed':'done','on-hold':'','overdue':'danger'};

let currentUser=null,currentView='dashboard',editingId=null,authToken=null,allUsers=[];

function getToken(){return authToken||localStorage.getItem('uba_token')}
function setToken(t){authToken=t;localStorage.setItem('uba_token',t)}
function clearToken(){authToken=null;localStorage.removeItem('uba_token');localStorage.removeItem('uba_user')}

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  const token=getToken();
  if(token) opts.headers['Authorization']='Bearer '+token;
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(API+path,opts);
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Request failed');
  return data;
}

async function apiUpload(path,formData){
  const res=await fetch(API+path,{method:'POST',headers:{'Authorization':'Bearer '+getToken()},body:formData});
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Upload failed');
  return data;
}

function showToast(msg,duration=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),duration);
}

function loadingHTML(msg='Loading...'){
  return `<div class="loading-state"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>${msg}</span></div>`;
}

function isOverdue(p){
  if(!p.deadline||p.status==='completed') return false;
  return new Date(p.deadline)<new Date();
}

function getProjectStatus(p){
  return isOverdue(p)?'overdue':p.status;
}

function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function fileIcon(type){
  if(!type) return '📎';
  if(type.includes('image')) return '🖼️';
  if(type.includes('pdf')) return '📄';
  if(type.includes('sheet')||type.includes('excel')) return '📊';
  if(type.includes('word')) return '📝';
  return '📎';
}

// AUTH
function switchTab(tab){
  const s=tab==='signin';
  document.getElementById('panel-signin').style.display=s?'block':'none';
  document.getElementById('panel-register').style.display=s?'none':'block';
  document.getElementById('tab-signin').style.background=s?'var(--ink)':'transparent';
  document.getElementById('tab-signin').style.color=s?'#fff':'var(--ink2)';
  document.getElementById('tab-register').style.background=s?'transparent':'var(--ink)';
  document.getElementById('tab-register').style.color=s?'var(--ink2)':'#fff';
  document.getElementById('login-error').textContent='';
  document.getElementById('login-success').style.display='none';
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  const btn=document.getElementById('login-btn');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='Email and password are required.';return;}
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Signing in...';
  try{
    const data=await api('POST','/auth/login',{email,password});
    setToken(data.access_token);currentUser=data.user;
    localStorage.setItem('uba_user',JSON.stringify(data.user));
    initApp();
  }catch(e){errEl.textContent=e.message;btn.disabled=false;btn.innerHTML='Sign in';}
}

async function doRegister(event){
  event.preventDefault();
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const password=document.getElementById('reg-password').value;
  const errEl=document.getElementById('login-error');
  const btn=document.getElementById('reg-btn');
  const succEl=document.getElementById('login-success');
  errEl.textContent='';succEl.style.display='none';
  if(!name||!email||!password){errEl.textContent='All fields are required.';return;}
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Creating account...';
  try{
    await api('POST','/auth/register',{name,email,password});
    succEl.innerHTML='<div class="success-msg">Account created! You can now sign in.</div>';
    succEl.style.display='block';
    document.getElementById('reg-name').value='';
    document.getElementById('reg-email').value='';
    document.getElementById('reg-password').value='';
    setTimeout(()=>switchTab('signin'),1500);
  }catch(e){errEl.textContent=e.message;}
  btn.disabled=false;btn.innerHTML='Create account';
}

async function checkExistingSession(){
  const token=getToken();
  if(!token) return false;
  try{const data=await api('GET','/auth/me');currentUser=data.user;return true;}
  catch(e){clearToken();return false;}
}

function initApp(){
  const u=currentUser;
  const initials=u.name?u.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2):u.email.slice(0,2).toUpperCase();
  document.getElementById('sidebar-avatar').textContent=initials;
  document.getElementById('sidebar-name').textContent=u.name||u.email;
  document.getElementById('sidebar-role').textContent=(u.role||'').replace(/_/g,' ');
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  api('GET','/members/users/all').then(d=>{allUsers=d.users||[];}).catch(()=>{});
  showView('dashboard');
}

function doLogout(){
  clearToken();currentUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-email').value='';
  document.getElementById('login-password').value='';
  document.getElementById('login-error').textContent='';
  const btn=document.getElementById('login-btn');
  btn.disabled=false;btn.innerHTML='Sign in';
}

// VIEWS
function showView(v){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+v);
  if(el) el.classList.add('active');
  const mc=document.getElementById('main-content');
  if(v==='dashboard') loadDashboard(mc);
  else if(v==='projects') loadProjects(mc);
  else if(v==='report') mc.innerHTML=renderReportView();
}

async function loadDashboard(mc){
  mc.innerHTML=loadingHTML('Loading dashboard...');
  try{
    const{projects}=await api('GET','/projects');
    const total=projects.length;
    const onTrack=projects.filter(p=>p.status==='on-track'&&!isOverdue(p)).length;
    const atRisk=projects.filter(p=>(p.status==='at-risk'||p.status==='blocked')&&!isOverdue(p)).length;
    const overdue=projects.filter(p=>isOverdue(p)).length;
    const avgProg=total?Math.round(projects.reduce((a,p)=>a+p.progress,0)/total):0;
    mc.innerHTML=`
      <div class="page-header">
        <div><h1 class="page-title">Dashboard</h1><div class="page-sub">Week of ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div></div>
        <button class="btn-add" onclick="openAddModal()"><span style="font-size:18px;line-height:1">+</span> New project</button>
      </div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Total projects</div><div class="stat-value">${total}</div></div>
        <div class="stat-card"><div class="stat-label">On track</div><div class="stat-value" style="color:#1D9E75">${onTrack}</div></div>
        <div class="stat-card"><div class="stat-label">At risk / blocked</div><div class="stat-value" style="color:#BA7517">${atRisk}</div></div>
        <div class="stat-card"><div class="stat-label">Overdue</div><div class="stat-value" style="color:#A32D2D">${overdue}</div></div>
      </div>
      <div class="projects-grid">${projects.length?projects.map(p=>projectCard(p)).join(''):'<div class="empty-state">No projects yet. Add your first one.</div>'}</div>`;
  }catch(e){mc.innerHTML=`<div class="empty-state">${e.message}</div>`;}
}

async function loadProjects(mc){
  mc.innerHTML=loadingHTML('Loading projects...');
  try{
    const{projects}=await api('GET','/projects');
    mc.innerHTML=`
      <div class="page-header">
        <div><h1 class="page-title">Projects</h1><div class="page-sub">${projects.length} project${projects.length!==1?'s':''}</div></div>
        <button class="btn-add" onclick="openAddModal()"><span style="font-size:18px;line-height:1">+</span> New project</button>
      </div>
      <div class="projects-grid">${projects.length?projects.map(p=>projectCard(p)).join(''):'<div class="empty-state">No projects yet.</div>'}</div>`;
  }catch(e){mc.innerHTML=`<div class="empty-state">${e.message}</div>`;}
}

function projectCard(p){
  const status=getProjectStatus(p);
  const fc=FILL_CLASS[status]||'';
  const members=p.members||[];
  return `<div class="project-card status-${status}" onclick="openDetail('${p.id}')">
    <div class="project-card-header">
      <div>
        <div class="project-card-name">${p.name}</div>
        <div class="project-card-owner">${p.owner_name}${p.country?` · <span style="font-size:11px;color:var(--ink3)">${p.country}</span>`:''}</div>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <span class="badge badge-${status}">${STATUS_LABELS[status]||status}</span>
        <button class="icon-btn" onclick="openEditModal('${p.id}')">Edit</button>
        <button class="icon-btn" onclick="openUpdateModal('${p.id}')">Update</button>
      </div>
    </div>
    <div class="project-card-meta">
      <div class="meta-item"><strong>${p.progress}%</strong>Progress</div>
      <div class="meta-item"><strong>${p.deadline?fmtDate(p.deadline):'—'}</strong>Deadline</div>
      <div class="meta-item"><strong>${p.country||'—'}</strong>Country</div>
      <div class="meta-item"><strong>${(p.files||[]).length||'—'}</strong>Files</div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-fill ${fc}" style="width:${p.progress}%"></div></div>
    ${p.comment?`<div class="project-card-comment">${p.comment}</div>`:''}
    ${members.length?`<div class="members-row">${members.map(m=>`<span class="member-chip">${m.name||m.email}</span>`).join('')}</div>`:''}
  </div>`;
}

async function openDetail(id){
  const mc=document.getElementById('main-content');
  mc.innerHTML=loadingHTML('Loading project...');
  try{
    const{project:p}=await api('GET','/projects/'+id);
    const updates=(p.updates||[]).slice().reverse();
    const status=getProjectStatus(p);
    let tasksHTML='';
    try{const{tasks}=await api('GET','/tasks/'+id);tasksHTML=renderTaskList(tasks,id);}
    catch(e){tasksHTML='<div style="color:var(--ink3);font-size:13px">Could not load tasks.</div>';}
    let membersHTML='';
    try{const{members}=await api('GET','/members/'+id);membersHTML=renderMemberList(members,id);}
    catch(e){membersHTML='';}
    const files=p.files||[];
    mc.innerHTML=`
      <div class="detail-header">
        <button class="back-btn" onclick="showView('${currentView}')">← Back</button>
        <div style="flex:1">
          <h1 class="page-title">${p.name}</h1>
          <div class="page-sub">${p.owner_name}${p.country?' · '+p.country:''} · <span class="badge badge-${status}">${STATUS_LABELS[status]||status}</span></div>
        </div>
        <button class="btn-add" onclick="openUpdateModal('${p.id}')">+ Post update</button>
      </div>
      <div class="detail-card">
        <div class="detail-section-title">Overview</div>
        <div class="detail-grid">
          <div class="detail-item"><label>Status</label><span><span class="badge badge-${status}">${STATUS_LABELS[status]||status}</span></span></div>
          <div class="detail-item"><label>Progress</label><span>${p.progress}%</span></div>
          <div class="detail-item"><label>Owner</label><span>${p.owner_name}</span></div>
          <div class="detail-item"><label>Deadline</label><span>${p.deadline?fmtDate(p.deadline):'—'}</span></div>
          <div class="detail-item"><label>Country</label><span>${p.country||'—'}</span></div>
          <div class="detail-item"><label>Documentation</label><span>${p.documentation||'—'}</span></div>
        </div>
        ${p.description?`<div style="font-size:13px;color:var(--ink2);line-height:1.6;margin-top:4px;padding-top:8px;border-top:0.5px solid var(--border)">${p.description}</div>`:''}
        <div class="progress-bar-wrap" style="height:5px;margin-top:12px"><div class="progress-fill ${FILL_CLASS[status]||''}" style="width:${p.progress}%"></div></div>
      </div>
      ${p.bottlenecks&&p.bottlenecks.filter(b=>b).length?`
      <div class="detail-card">
        <div class="detail-section-title">Bottlenecks & blockers</div>
        ${p.bottlenecks.filter(b=>b).map(b=>`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px"><div style="width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-top:5px"></div><div style="font-size:13px">${b}</div></div>`).join('')}
      </div>`:''}
      <div class="detail-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
          <div class="detail-section-title" style="margin:0">Tasks</div>
          <button class="icon-btn" onclick="openAddTaskModal('${id}')">+ Add task</button>
        </div>
        ${tasksHTML}
      </div>
      <div class="detail-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
          <div class="detail-section-title" style="margin:0">Team members</div>
          <button class="icon-btn" onclick="openAddMemberModal('${id}')">+ Add member</button>
        </div>
        ${membersHTML}
      </div>
      <div class="detail-card">
        <div class="detail-section-title">Files & attachments</div>
        ${files.length?`<div class="file-list">${files.map(f=>`
          <div class="file-item">
            <span class="file-icon">${fileIcon(f.type)}</span>
            <span class="file-name">${f.name}</span>
            <a class="file-link" href="${f.url}" target="_blank">View</a>
            <button class="file-remove" onclick="removeFile('${id}','${f.url}')">×</button>
          </div>`).join('')}</div>`:''}
        <label class="upload-zone" for="file-upload-detail">Click to upload file (image, PDF, document)</label>
        <input type="file" id="file-upload-detail" style="display:none" onchange="uploadFile('${id}',this)">
      </div>
      <div class="detail-card">
        <div class="detail-section-title">Update history</div>
        ${updates.length?updates.map(u=>`
          <div class="update-item">
            <div class="update-date">${new Date(u.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
            <div class="update-comment">${u.comment||'—'}</div>
            <div class="update-tags">
              <span class="badge badge-${u.status}" style="font-size:10px">${STATUS_LABELS[u.status]||u.status}</span>
              <span style="font-size:11px;color:var(--ink3);align-self:center">${u.progress}% complete</span>
            </div>
            ${u.bottlenecks&&u.bottlenecks.filter(b=>b).length?`<div style="margin-top:6px;font-size:12px;color:var(--amber-text);background:var(--amber-bg);border-radius:6px;padding:5px 10px">Blockers: ${u.bottlenecks.filter(b=>b).join('; ')}</div>`:''}
          </div>`).join(''):'<div style="color:var(--ink3);font-size:13px">No updates yet.</div>'}
      </div>`;
  }catch(e){mc.innerHTML=`<div class="empty-state">${e.message}</div>`;}
}

function renderTaskList(tasks,projectId){
  if(!tasks||!tasks.length) return '<div style="color:var(--ink3);font-size:13px;padding:.5rem 0">No tasks yet. Add your first task.</div>';
  return `<div class="task-list">${tasks.map(t=>{
    const deps=t.task_dependencies||[];
    const overdueTask=t.due_date&&t.status!=='completed'&&new Date(t.due_date)<new Date();
    const checkClass=t.status==='completed'?'done':t.status==='in-progress'?'in-progress':t.status==='blocked'?'blocked':'';
    const checkMark=t.status==='completed'?'✓':t.status==='in-progress'?'●':t.status==='blocked'?'✕':'';
    return `<div class="task-item${overdueTask?' overdue':''}">
      <div class="task-check ${checkClass}" onclick="cycleTaskStatus('${t.id}','${t.status}','${projectId}')">${checkMark}</div>
      <div class="task-content">
        <div class="task-name" style="${t.status==='completed'?'text-decoration:line-through;opacity:.6':''}">${t.name}</div>
        <div class="task-meta">
          ${t.due_date?`<span class="task-due${overdueTask?' overdue':''}">Due: ${fmtDate(t.due_date)}</span>`:''}
          ${deps.length?`<span class="task-dep">Depends on ${deps.length} task${deps.length>1?'s':''}</span>`:''}
          ${t.assignee?`<span style="font-size:11px;color:var(--ink3)">${t.assignee.name||t.assignee.email}</span>`:''}
        </div>
      </div>
      <div class="task-actions">
        <button class="task-btn" onclick="openEditTaskModal('${t.id}','${projectId}')">Edit</button>
        <button class="task-btn" onclick="deleteTask('${t.id}','${projectId}')">×</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderMemberList(members,projectId){
  if(!members||!members.length) return '<div style="color:var(--ink3);font-size:13px;padding:.5rem 0">No team members yet.</div>';
  return `<div class="member-list">${members.map(m=>`
    <div class="member-item">
      <div class="member-avatar">${(m.user.name||m.user.email).slice(0,2).toUpperCase()}</div>
      <div class="member-info">
        <div class="member-name">${m.user.name||m.user.email}</div>
        <div class="member-email">${m.user.email} · ${m.role}</div>
      </div>
      <button class="member-remove" onclick="removeMember('${projectId}','${m.user.id}')">×</button>
    </div>`).join('')}</div>`;
}

// MODALS
function openAddModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='Add project';
  document.getElementById('modal-body').innerHTML=projectForm(null);
  document.getElementById('modal-overlay').classList.add('open');
}

async function openEditModal(id){
  try{
    const{project:p}=await api('GET','/projects/'+id);
    editingId=id;
    document.getElementById('modal-title').textContent='Edit project';
    document.getElementById('modal-body').innerHTML=projectForm(p);
    document.getElementById('modal-overlay').classList.add('open');
  }catch(e){showToast('Could not load project');}
}

async function openUpdateModal(id){
  try{
    const{project:p}=await api('GET','/projects/'+id);
    editingId=id;
    document.getElementById('modal-title').textContent='Post update — '+p.name;
    document.getElementById('modal-body').innerHTML=updateForm(p);
    document.getElementById('modal-overlay').classList.add('open');
  }catch(e){showToast('Could not load project');}
}

function openAddTaskModal(projectId){
  document.getElementById('modal-title').textContent='Add task';
  document.getElementById('modal-body').innerHTML=taskForm(null,projectId,[]);
  document.getElementById('modal-overlay').classList.add('open');
}

async function openEditTaskModal(taskId,projectId){
  try{
    const{tasks}=await api('GET','/tasks/'+projectId);
    const task=tasks.find(t=>t.id===taskId);
    if(!task) return showToast('Task not found');
    document.getElementById('modal-title').textContent='Edit task';
    document.getElementById('modal-body').innerHTML=taskForm(task,projectId,tasks);
    document.getElementById('modal-overlay').classList.add('open');
  }catch(e){showToast('Could not load task');}
}

function openAddMemberModal(projectId){
  document.getElementById('modal-title').textContent='Add team member';
  document.getElementById('modal-body').innerHTML=memberForm(projectId);
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}

function projectForm(p){
  const blist=(p&&p.bottlenecks&&p.bottlenecks.length?p.bottlenecks:['']);
  return `
    <div class="form-row">
      <div class="fg"><label>Project name</label><input id="f-name" value="${p?p.name:''}" placeholder="e.g. Credit scoring model v2"></div>
      <div class="fg"><label>Owner</label><input id="f-owner" value="${p?p.owner_name:(currentUser.name||currentUser.email)}" placeholder="Full name"></div>
    </div>
    <div class="form-row full"><div class="fg"><label>Description</label><textarea id="f-description" rows="2" placeholder="Brief description of the project goals...">${p&&p.description?p.description:''}</textarea></div></div>
    <div class="form-row three">
      <div class="fg"><label>Status</label><select id="f-status">${Object.entries(STATUS_LABELS).filter(([k])=>k!=='overdue').map(([k,v])=>`<option value="${k}"${p&&p.status===k?' selected':''}>${v}</option>`).join('')}</select></div>
      <div class="fg"><label>Progress (%)</label><input id="f-progress" type="number" min="0" max="100" value="${p?p.progress:0}"></div>
      <div class="fg"><label>Country</label><select id="f-country"><option value="">— Select —</option>${COUNTRIES.map(c=>`<option value="${c}"${p&&p.country===c?' selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Expected delivery (deadline)</label><input id="f-deadline" type="date" value="${p&&p.deadline?p.deadline.split('T')[0]:''}"></div>
      <div class="fg"><label>Documentation / links</label><input id="f-doc" value="${p&&p.documentation?p.documentation:''}" placeholder="GitHub, Confluence, Jira..."></div>
    </div>
    <div class="form-row full"><div class="fg"><label>Bottlenecks & blockers</label>
      <div id="b-list">${blist.map((b,i)=>`<div class="b-row" id="brow-${i}"><input value="${b}" placeholder="Describe blocker..."><button class="b-remove" onclick="removeBottleneck(${i})" type="button">×</button></div>`).join('')}</div>
      <button class="btn-ghost" type="button" onclick="addBottleneck()">+ add bottleneck</button>
    </div></div>
    <div class="form-row full"><div class="fg"><label>Comments & next steps</label><textarea id="f-comment" rows="3" placeholder="Key updates, decisions, next week's plan...">${p&&p.comment?p.comment:''}</textarea></div></div>
    <div class="modal-actions">
      ${p?`<button class="btn-danger" onclick="deleteProject('${p.id}')">Delete</button>`:''}
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="width:auto;padding:8px 20px" id="save-btn" onclick="saveProject()">Save project</button>
    </div>`;
}

    <div class="form-row full"><div class="fg"><label>Description</label><textarea id="t-desc" rows="2" placeholder="What needs to be done...">${task&&task.description?task.description:''}</textarea></div></div>
    <div class="form-row">
      <div class="fg"><label>Status</label><select id="t-status">
        <option value="pending"${!task||task.status==='pending'?' selected':''}>Pending</option>
        <option value="in-progress"${task&&task.status==='in-progress'?' selected':''}>In progress</option>
        <option value="completed"${task&&task.status==='completed'?' selected':''}>Completed</option>
        <option value="blocked"${task&&task.status==='blocked'?' selected':''}>Blocked</option>
      </select></div>
      <div class="fg"><label>Due date</label><input id="t-due" type="date" value="${task&&task.due_date?task.due_date.split('T')[0]:''}"></div>
    </div>
    <div class="form-row full"><div class="fg"><label>Assignee</label><select id="t-assignee">
      <option value="">— Unassigned —</option>
      ${allUsers.map(u=>`<option value="${u.id}"${task&&task.assignee_id===u.id?' selected':''}>${u.name||u.email}</option>`).join('')}
    </select></div></div>
    ${otherTasks.length?`
    <div class="form-row full"><div class="fg"><label>Depends on</label>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto;border:0.5px solid var(--border2);border-radius:var(--r);padding:6px">
        ${otherTasks.map(t=>`
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:3px 4px">
            <input type="checkbox" value="${t.id}" ${currentDeps.includes(t.id)?'checked':''} style="width:auto">
            ${t.name}
          </label>`).join('')}
      </div>
    </div></div>`:''}
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="width:auto;padding:8px 20px" onclick="saveTask('${projectId}','${task?task.id:''}')">Save task</button>
    </div>`;
}

function memberForm(projectId){
  const available=allUsers.filter(u=>u.id!==currentUser.id);
  return `
    <div class="form-group"><label>Select team member</label>
      <select id="m-user" style="width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);outline:none">
        <option value="">— Choose a registered user —</option>
        ${available.map(u=>`<option value="${u.id}">${u.name||u.email} (${u.email})</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Role</label>
      <select id="m-role" style="width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);outline:none">
        <option value="member">Member</option>
        <option value="viewer">Viewer</option>
        <option value="owner">Owner</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="width:auto;padding:8px 20px" onclick="addMember('${projectId}')">Add member</button>

function updateForm(p){
  return `
    <div class="form-row">
      <div class="fg"><label>Status</label><select id="f-status">${Object.entries(STATUS_LABELS).filter(([k])=>k!=='overdue').map(([k,v])=>`<option value="${k}"${p.status===k?' selected':''}>${v}</option>`).join('')}</select></div>
      <div class="fg"><label>Progress (%)</label><input id="f-progress" type="number" min="0" max="100" value="${p.progress}"></div>
    </div>
    <div class="form-row full"><div class="fg"><label>Bottlenecks this week</label>
      <div id="b-list"><div class="b-row" id="brow-0"><input id="b-0" placeholder="Any blockers? Leave blank if none."><button class="b-remove" onclick="removeBottleneck(0)" type="button">×</button></div></div>
      <button class="btn-ghost" type="button" onclick="addBottleneck()">+ add bottleneck</button>
    </div></div>
    <div class="form-row full"><div class="fg"><label>Update note</label><textarea id="f-comment" rows="3" placeholder="What happened this week? What's next?"></textarea></div></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="width:auto;padding:8px 20px" id="update-btn" onclick="postUpdate()">Post update</button>
    </div>`;
}

function getBotList(){
  const bl=document.getElementById('b-list');
  if(!bl) return[];
  return Array.from(bl.querySelectorAll('input')).map(i=>i.value.trim()).filter(v=>v);
}

function addBottleneck(){
  const bl=document.getElementById('b-list');
  const i=bl.children.length;
  const div=document.createElement('div');
  div.className='b-row';div.id='brow-'+i;
  div.innerHTML=`<input placeholder="Describe blocker..." id="b-${i}"><button class="b-remove" onclick="removeBottleneck(${i})" type="button">×</button>`;
  bl.appendChild(div);
}

function removeBottleneck(i){
  const row=document.getElementById('brow-'+i)||document.querySelectorAll('.b-row')[i];
  if(row) row.remove();
}

async function saveProject(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){showToast('Project name is required');return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Saving...';
  const body={
    name,
    owner_name:document.getElementById('f-owner').value.trim()||currentUser.name,
    description:document.getElementById('f-description').value.trim(),
    status:document.getElementById('f-status').value,
    progress:Math.min(100,Math.max(0,parseInt(document.getElementById('f-progress').value)||0)),
    country:document.getElementById('f-country').value,
    deadline:document.getElementById('f-deadline').value||null,
    documentation:document.getElementById('f-doc').value.trim(),
    bottlenecks:getBotList(),
    comment:document.getElementById('f-comment').value.trim()
  };
  try{
    if(editingId){await api('PUT','/projects/'+editingId,body);showToast('Project updated');}
    else{await api('POST','/projects',body);showToast('Project created');}
    closeModal();showView(currentView);
  }catch(e){
    showToast(e.message);
    btn.disabled=false;btn.innerHTML='Save project';
  }
}

async function postUpdate(){
  const btn=document.getElementById('update-btn');
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Posting...';
  const body={
    project_id:editingId,
    status:document.getElementById('f-status').value,
    progress:Math.min(100,Math.max(0,parseInt(document.getElementById('f-progress').value)||0)),
    comment:document.getElementById('f-comment').value.trim(),
    bottlenecks:getBotList()
  };
  try{
    await api('POST','/updates',body);
    showToast('Update posted');
    closeModal();showView(currentView);
  }catch(e){
    showToast(e.message);
    btn.disabled=false;btn.innerHTML='Post update';
  }
}

async function deleteProject(id){
  if(!confirm('Delete this project? This cannot be undone.')) return;
  try{
    await api('DELETE','/projects/'+id);
    showToast('Project deleted');
    closeModal();showView(currentView);
  }catch(e){showToast(e.message);}
}

// TASKS
async function saveTask(projectId,taskId){
  const name=document.getElementById('t-name').value.trim();
  if(!name){showToast('Task name is required');return;}
  const depCheckboxes=Array.from(document.querySelectorAll('#modal-body input[type="checkbox"]:checked')).map(c=>c.value);
  const body={
    project_id:projectId,
    name,
    description:document.getElementById('t-desc').value.trim(),
    status:document.getElementById('t-status').value,
    due_date:document.getElementById('t-due').value||null,
    assignee_id:document.getElementById('t-assignee').value||null
  };
  try{
    let savedTask;
    if(taskId){savedTask=(await api('PUT','/tasks/'+taskId,body)).task;}
    else{savedTask=(await api('POST','/tasks',body)).task;}
    for(const depId of depCheckboxes){
      await api('POST','/tasks/dependency',{task_id:savedTask.id,depends_on_id:depId}).catch(()=>{});
    }
    showToast(taskId?'Task updated':'Task added');
    closeModal();openDetail(projectId);
  }catch(e){showToast(e.message);}
}

async function cycleTaskStatus(taskId,currentStatus,projectId){
  const cycle={'pending':'in-progress','in-progress':'completed','completed':'pending','blocked':'in-progress'};
  try{
    await api('PUT','/tasks/'+taskId,{status:cycle[currentStatus]||'in-progress'});
    openDetail(projectId);
  }catch(e){showToast(e.message);}
}

async function deleteTask(taskId,projectId){
  if(!confirm('Delete this task?')) return;
  try{
    await api('DELETE','/tasks/'+taskId);
    showToast('Task deleted');
    openDetail(projectId);
  }catch(e){showToast(e.message);}
}

// MEMBERS
async function addMember(projectId){
  const userId=document.getElementById('m-user').value;
  const role=document.getElementById('m-role').value;
  if(!userId){showToast('Please select a user');return;}
  try{
    await api('POST','/members',{project_id:projectId,user_id:userId,role});
    showToast('Member added');
    closeModal();openDetail(projectId);
  }catch(e){showToast(e.message);}
}

async function removeMember(projectId,userId){
  if(!confirm('Remove this member?')) return;
  try{
    await api('DELETE',`/members/${projectId}/${userId}`);
    showToast('Member removed');
    openDetail(projectId);
  }catch(e){showToast(e.message);}
}

// FILES
async function uploadFile(projectId,input){
  const file=input.files[0];
  if(!file) return;
  showToast('Uploading...');
  try{
    const formData=new FormData();
    formData.append('file',file);
    await apiUpload(`/upload?project_id=${projectId}`,formData);
    showToast('File uploaded!');
    openDetail(projectId);
  }catch(e){showToast('Upload failed: '+e.message);}
}

async function removeFile(projectId,url){
  if(!confirm('Remove this file?')) return;
  try{
    await api('DELETE','/upload',{project_id:projectId,url});
    showToast('File removed');
    openDetail(projectId);
  }catch(e){showToast(e.message);}
}

// REPORT

  return `
    <div class="page-header">
      <div><h1 class="page-title">Executive report</h1><div class="page-sub">Generate a presentation-ready summary</div></div>
    </div>
    <div class="report-controls">
      <div class="fg"><label style="display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px">Reporting period</label><input id="r-period" type="text" value="Week of ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}" style="width:200px"></div>
      <div class="fg"><label style="display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px">Prepared by</label><input id="r-author" type="text" value="${currentUser?currentUser.name||currentUser.email:''}" style="width:160px"></div>
      <div class="fg"><label style="display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px">Filter status</label><select id="r-filter" style="width:140px"><option value="all">All projects</option><option value="on-track">On track</option><option value="at-risk">At risk</option><option value="blocked">Blocked</option><option value="completed">Completed</option></select></div>
      <button class="btn-export" onclick="loadAndRenderReport()">Preview report</button>
      <button class="btn-export" style="background:var(--green)" onclick="printReport()">Export / print</button>
      <button class="btn-export" style="background:#185FA5" onclick="exportExcel()">Export Excel</button>
    </div>
    <div class="report-preview" id="report-preview"><div style="color:var(--ink3);font-size:14px">Click "Preview report" to generate.</div></div>`;
}

async function loadAndRenderReport(){
  const filter=document.getElementById('r-filter').value;
  const period=document.getElementById('r-period').value;
  const preview=document.getElementById('report-preview');
  preview.innerHTML=loadingHTML('Generating report...');
  try{
    const data=await api('GET',`/reports/generate?status_filter=${filter}&period=${encodeURIComponent(period)}`);
    renderReport(data);
  }catch(e){preview.innerHTML=`<div class="empty-state">${e.message}</div>`;}
}

function renderReport(data){
  const author=document.getElementById('r-author').value;
  const{summary,projects,blockers,period}=data;
  document.getElementById('report-preview').innerHTML=`
  <div class="report-doc" id="printable-report">
    <div class="r-header">
      <div><div class="r-org">UBA Group — Data Science</div><div class="r-title">Weekly project status report</div></div>
      <div class="r-meta"><div>${period}</div><div>Prepared by: ${author}</div><div>Presented to: Head of Data / Executive Management</div></div>
    </div>
    <h2>Portfolio summary</h2>
    <div class="r-summary-grid">
      <div class="r-stat"><div class="r-stat-val">${summary.total}</div><div class="r-stat-lbl">Total projects</div></div>
      <div class="r-stat"><div class="r-stat-val" style="color:#1D9E75">${summary.on_track}</div><div class="r-stat-lbl">On track</div></div>
      <div class="r-stat"><div class="r-stat-val" style="color:#BA7517">${summary.at_risk}</div><div class="r-stat-lbl">At risk / blocked</div></div>
      <div class="r-stat"><div class="r-stat-val">${summary.avg_progress}%</div><div class="r-stat-lbl">Avg progress</div></div>
    </div>
    <h2>Project status</h2>
    ${projects.map(p=>{
      const over=isOverdue(p);
      const st=over?'overdue':p.status;
      return `<div class="r-project">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <div class="r-proj-name">${p.name}${p.country?` <span style="font-size:12px;font-weight:400;color:#8a8a8a">· ${p.country}</span>`:''}</div>
          <span class="badge badge-${st}">${STATUS_LABELS[st]||st}</span>
        </div>
        <div class="r-proj-row">
          <div>Owner<span>${p.owner_name}</span></div>
          <div>Deadline<span>${p.deadline?fmtDate(p.deadline):'—'}</span></div>
          <div>Progress<span>${p.progress}%</span></div>
        </div>
        <div class="r-prog"><div class="r-prog-fill" style="width:${p.progress}%;background:${over?'#A32D2D':p.status==='at-risk'?'#BA7517':p.status==='blocked'?'#A32D2D':p.status==='completed'?'#185FA5':'#1D9E75'}"></div></div>
        ${p.description?`<div style="font-size:12px;color:#4a4a4a;margin-top:4px;line-height:1.5">${p.description}</div>`:''}
        ${p.documentation?`<div style="font-size:12px;color:#4a4a4a;margin-top:4px">Docs: ${p.documentation}</div>`:''}
        ${p.comment?`<div style="font-size:13px;color:#0f0f0f;margin-top:6px;line-height:1.6">${p.comment}</div>`:''}
        ${p.bottlenecks&&p.bottlenecks.filter(b=>b).length?`<div class="r-block">Blockers: ${p.bottlenecks.filter(b=>b).join(' · ')}</div>`:''}
      </div>`;
    }).join('')}
    ${blockers&&blockers.length?`
    <h2>Key blockers requiring attention</h2>
    <div style="background:#FAEEDA;border-radius:8px;padding:1rem;margin-bottom:1rem">
      ${blockers.map(p=>`<div style="margin-bottom:.75rem"><strong style="font-size:13px;color:#633806">${p.name}</strong>${(p.bottlenecks||[]).filter(b=>b).map(b=>`<div style="font-size:12px;color:#854F0B;margin-top:3px">· ${b}</div>`).join('')}</div>`).join('')}
    </div>`:''}
    <div class="r-footer">
      <span>UBA Group — Data Science Division, Mozambique</span>
      <span>Generated ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>
  </div>`;
}

async function printReport(){
  await loadAndRenderReport();
  setTimeout(()=>window.print(),500);
}

async function exportExcel(){
  showToast('Preparing Excel file...');
  const filter=document.getElementById('r-filter')?document.getElementById('r-filter').value:'all';
  const period=document.getElementById('r-period')?document.getElementById('r-period').value:'';
  const author=document.getElementById('r-author')?document.getElementById('r-author').value:(currentUser.name||currentUser.email);
  try{
    const data=await api('GET',`/reports/generate?status_filter=${filter}&period=${encodeURIComponent(period)}`);
    const{summary,projects}=data;
    if(!window.XLSX){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload=res;s.onerror=rej;document.head.appendChild(s);
      });
    }
    const wb=XLSX.utils.book_new();
    const wsSummary=XLSX.utils.aoa_to_sheet([
      ['UBA Group — Data Science Division'],
      ['Weekly Project Status Report'],
      ['Period:',period],['Prepared by:',author],
      ['Generated:',new Date().toLocaleDateString('en-GB')],
      [],
      ['PORTFOLIO SUMMARY'],
      ['Total Projects','On Track','At Risk / Blocked','Completed','Avg Progress'],
      [summary.total,summary.on_track,summary.at_risk,summary.completed,summary.avg_progress+'%'],
    ]);
    wsSummary['!cols']=[{wch:25},{wch:15},{wch:20},{wch:15},{wch:15}];
    XLSX.utils.book_append_sheet(wb,wsSummary,'Summary');
    const wsProjects=XLSX.utils.aoa_to_sheet([
      ['Project Name','Owner','Country','Status','Progress (%)','Deadline','Description','Documentation','Bottlenecks','Comments'],
      ...projects.map(p=>{
        const over=isOverdue(p);
        const st=over?'Overdue':p.status.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
        return[p.name,p.owner_name,p.country||'—',st,p.progress,
          p.deadline?fmtDate(p.deadline):'—',p.description||'—',p.documentation||'—',
          (p.bottlenecks||[]).filter(b=>b).join('; ')||'—',p.comment||'—'];
      })
    ]);
    wsProjects['!cols']=[{wch:30},{wch:20},{wch:15},{wch:15},{wch:12},{wch:15},{wch:30},{wch:25},{wch:40},{wch:40}];
    XLSX.utils.book_append_sheet(wb,wsProjects,'Projects');
    const blockers=projects.filter(p=>p.bottlenecks&&p.bottlenecks.filter(b=>b).length>0);
    if(blockers.length){
      const wsBlockers=XLSX.utils.aoa_to_sheet([
        ['Project','Owner','Country','Status','Blocker'],
        ...blockers.flatMap(p=>p.bottlenecks.filter(b=>b).map(b=>[p.name,p.owner_name,p.country||'—',p.status,b]))
      ]);
      wsBlockers['!cols']=[{wch:30},{wch:20},{wch:15},{wch:15},{wch:50}];
      XLSX.utils.book_append_sheet(wb,wsBlockers,'Blockers');
    }
    XLSX.writeFile(wb,`UBA_Data_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
    showToast('Excel file downloaded!');
  }catch(e){showToast('Failed to export: '+e.message);}
}
